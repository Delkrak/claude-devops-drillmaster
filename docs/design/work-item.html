  /* the route: one block per step (or split), the line drawn through each block */
  .block{position:relative}
  .block>.seg{position:absolute;left:448.5px;width:3px;border-radius:2px}
  .seg.done{background:var(--line)} .seg.ahead{background:var(--ahead)} .seg.after{width:0;left:449px;border-left:2.5px dotted var(--dim);border-radius:0}
  .block>svg{position:relative;display:block}
  .stage-rule{border-top:1px solid var(--rule)}
  .row{cursor:pointer;outline:none}
  .row:focus-visible .hit{stroke:var(--line);stroke-width:1.5}
  .hit{fill:transparent}
  .row:hover .hit{fill:rgba(217,222,214,.04)}
  [data-tip]{cursor:help}

  /* drilling in: one level at a time, right of the line, under the step's name */
  .panels{display:flow-root}
  .panel{position:relative;margin:0 0 18px 480px;width:390px;font-size:14px;line-height:1.45}
  .panel .lvl{padding:2px 0 10px}
  .panel .lvl+.lvl{border-top:1px solid var(--rule);padding-top:12px}
  .label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:8px 0 2px}
  .label.sand{color:var(--sand)} .label.orange{color:var(--orange)}
  .panel p{margin:0 0 6px}
  .quote{color:var(--line);font-weight:600}
  .more{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:14px;border:1px solid var(--rule);background:transparent;color:var(--line);font:700 13px Barlow;cursor:pointer}
  .more:hover,.more:focus-visible{border-color:var(--dim);outline:none}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--dim);white-space:pre-wrap;word-break:break-word;margin:2px 0 8px}
  .call{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--rule)}
  .call .t{color:var(--dim)} .call b{font-weight:700} .call .in{grid-column:2;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--dim);word-break:break-all}

  .key{position:fixed;right:24px;bottom:18px;z-index:4;display:flex;flex-direction:column;gap:7px;padding:12px 16px;border-radius:12px;background:rgba(20,26,22,.92);border:1px solid var(--rule);font-size:12.5px;font-weight:600;color:var(--dim)}

  .tip{position:fixed;z-index:9;pointer-events:none;max-width:40ch;padding:5px 10px;border-radius:6px;background:#E9EDE6;color:#111;font-size:13px;font-weight:600;display:none}

      "self_check": [],
      "captures": []
     },
     "calls": [
      {
       "at": "2026-11-20T19:10:11.491Z",
       "tool": "Bash",
       "did": "cd . && node --input-type=module -e \"\nimport { readFileSync } from 'node:fs'\nimport { toJson } from './src/js…",
       "failed": false
      }
     ]
    },
    {
     "n": 3,
     "name": "show the bug is fixed",
     "gate": "self",
     "if": "kind == 'bug'",
     "when": "kind is bug",
     "alternative": {
      "input": "kind",
      "value": "bug"
     },
     "status": "skipped",
     "happened": {
      "skip": {
       "by": "condition",
       "why": "step 4.3 \"show the bug is fixed\" applies only when kind == 'bug', and kind is feature."
      },
      "verdicts": [],
      "reports": [],
      "submitted": null,
      "waiting": null
     },
     "evidence": {
      "self_check": [],
      "captures": []
     },
     "calls": []
    },
    {
     "n": 4,
     "name": "have the change reviewed",
     "gate": "drillmaster",
     "if": null,
     "when": null,
     "alternative": null,
     "status": "here",
     "happened": {
      "skip": null,
      "verdicts": [],
      "reports": [],
      "submitted": null,
      "waiting": null
     },
     "evidence": {
      "self_check": [],
      "captures": []
     },
     "calls": []
    }
   ]
  }
 ],
 "friction": [],
 "delivered": null
};
</script>
<script>
const C={ground:'#0F1311',line:'#D9DED6',ahead:'#3A443C',dim:'#8E998F',sand:'#E3C97E',orange:'#FF7A1A',rule:'#232A25'};
const W=900,AXIS=450,ROW=46,SPLIT=34,ITEM_X=AXIS-70,PROBLEM_X=AXIS+44;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const time=iso=>iso.slice(11,16);
const which=new URLSearchParams(location.search).get('item')||'2';
const I=window.ITEMS[which];

// ---- the stops, as on the Workflow page; faded when skipped, dim when still ahead
const kindOf=s=>s.gate==='owner'?'approve':s.gate==='drillmaster'?'review':s.if?'if':'always';
const STOP_TIP={always:'always runs',if:'runs only if its condition holds',approve:'you approve this step',review:'Drillmaster reviews this step'};
function stop(x,y,s){
  const k=kindOf(s),op=s.status==='skipped'?.28:s.status==='ahead'?.5:1;
  const tip=STOP_TIP[k]+(s.when?': only when '+s.when:'');
  const g=(inner)=>'<g opacity="'+op+'" data-tip="'+esc(tip)+'">'+inner+'</g>';
  if(k==='approve')return g('<path d="M'+x+' '+(y-13)+' L'+(x+13)+' '+y+' L'+x+' '+(y+13)+' L'+(x-13)+' '+y+' Z" fill="'+C.ground+'" stroke="'+C.sand+'" stroke-width="2.5" stroke-linejoin="round"/>');
  if(k==='review')return g('<circle cx="'+x+'" cy="'+y+'" r="14" fill="'+C.ground+'" stroke="'+C.line+'" stroke-width="2"/><rect x="'+(x-5.5)+'" y="'+(y-5.5)+'" width="11" height="11" rx="2" fill="'+C.line+'"/>');
  return g('<rect x="'+(x-8)+'" y="'+(y-8)+'" width="16" height="16" rx="4" fill="'+(k==='if'?C.ground:C.line)+'" stroke="'+C.line+'" stroke-width="2.5"/>');
}
// what a step's name says under it: skipped and why, where it waits, or nothing
function note(s){
  if(s.status==='skipped')return 'skipped: only when '+s.when;
  if(s.status==='here')return s.happened.waiting==='drillmaster'?'waiting for Drillmaster\'s review':s.happened.waiting==='owner'?'waiting for you':'Agent is working here';
  return '';
}
function label(x,y,side,s){
  const lx=side==='l'?x-26:x+26,a=side==='l'?'end':'start';
  const fill=s.status==='skipped'||s.status==='ahead'?C.dim:C.line,op=s.status==='skipped'?.55:1;
  let out='<text x="'+lx+'" y="'+(y+5)+'" text-anchor="'+a+'" font-size="16" font-weight="700" fill="'+fill+'" opacity="'+op+'">'+esc(s.name)+'</text>';
  const n=note(s);
  if(n)out+='<text x="'+lx+'" y="'+(y+23)+'" text-anchor="'+a+'" font-size="12.5" fill="'+(s.status==='here'?C.sand:C.dim)+'" opacity="'+(s.status==='skipped'?.75:1)+'">'+esc(n)+'</text>';
  return out;
}
// work item side: where the item is now, and Drillmaster's pass; problem side: work sent back
function marks(x,y,s,side){
  let out='';
  const passed=s.happened.verdicts.filter(v=>v.by==='drillmaster'&&v.accepted).length;
  const back=s.happened.verdicts.filter(v=>!v.accepted&&v.by!=='agent').length;
  if(s.status==='here'){const w=50;out+='<g data-tip="'+esc(I.issue+' is here now')+'"><rect x="'+(ITEM_X+12-w)+'" y="'+(y-11)+'" width="'+w+'" height="22" rx="11" fill="none" stroke="'+C.line+'" stroke-width="1.5"/><circle cx="'+ITEM_X+'" cy="'+y+'" r="5" fill="'+C.line+'"/><text x="'+(ITEM_X-10)+'" y="'+(y+5)+'" text-anchor="end" font-size="13" font-weight="700" fill="'+C.line+'">'+esc(I.issue)+'</text></g>';}
  if(passed)out+='<text data-tip="Drillmaster passed it here" x="'+(side==='l'?x-26-s.name.length*8.6-16:x-24)+'" y="'+(y+5)+'" text-anchor="end" font-size="13" font-weight="700" fill="'+C.line+'">&#10003;</text>';
  if(s.frictions&&s.frictions.length){const rx=side==='r'?x+26+s.name.length*8.6+24:x+30;out+='<g data-tip="you stepped in '+s.frictions.length+' time'+(s.frictions.length>1?'s':'')+'; this step should have caught it"><circle cx="'+rx+'" cy="'+y+'" r="14" fill="'+C.ground+'" stroke="'+C.orange+'" stroke-width="2.5"/><text x="'+rx+'" y="'+(y+5)+'" text-anchor="middle" font-size="13" font-weight="700" fill="'+C.orange+'">'+s.frictions.length+'</text></g>'}
  if(back)out+='<text data-tip="sent back '+back+' times here" x="'+PROBLEM_X+'" y="'+(y+5)+'" font-size="13" font-weight="700" fill="'+C.sand+'">&#8617; '+back+'</text>';
  return out;
}
const lineState=s=>s.status==='ahead'||s.status==='here'?'ahead':'done';

// ---- the route, block by block
const main=document.getElementById('main');
const kindWord=I.kind?I.kind:'';
const status=I.status==='delivered'
  ?'delivered <b>'+new Date(I.delivered.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'UTC'})+'</b>'
  :(()=>{for(const st of I.stages)for(const s of st.steps)if(s.status==='here')return 'in progress at <b>'+esc(s.name)+'</b>';return 'waiting to be delivered'})();
main.innerHTML='<div class="title"><span class="issue">'+esc(I.issue)+'</span><span class="kind">'+esc(kindWord)+'</span><span class="status">'+status+'</span></div>'
  +'<div class="what" data-tip="'+esc(I.description)+'">'+esc(I.description)+'</div>';

const altOf=s=>s.alternative;
function groups(steps){const out=[];for(let i=0;i<steps.length;i++){const a=altOf(steps[i]),b=steps[i+1]&&altOf(steps[i+1]);if(a&&b&&a.input===b.input&&a.value!==b.value){out.push([steps[i],steps[i+1]]);i++}else out.push(steps[i])}return out}
const fork=(y0,y1,x)=>{const r=SPLIT;return 'M'+AXIS+' '+y0+' C'+AXIS+' '+(y0+r/2)+' '+x+' '+(y0+r/2)+' '+x+' '+(y0+r)+' V'+(y1-r)+' C'+x+' '+(y1-r/2)+' '+AXIS+' '+(y1-r/2)+' '+AXIS+' '+y1};

let blocks=[];
function block(html,height,top,bottom,rows){
  const el=document.createElement('div');el.className='block';
  el.innerHTML='<i class="seg '+top+'" style="top:0;height:'+(height/2)+'px"></i><i class="seg '+bottom+'" style="top:'+(height/2)+'px;bottom:0"></i>'
    +'<svg width="'+W+'" height="'+height+'" viewBox="0 0 '+W+' '+height+'">'+html+'</svg><div class="panels"></div>';
  main.appendChild(el);
  for(const r of rows||[])wireRow(el,r);
  return el;
}
// a clickable step: its hit area, opening its panel under the block
function hitArea(id,y,h,s,st,inner){return '<g class="row" tabindex="0" role="button" aria-label="'+esc(st.n+'.'+s.n+' '+s.name)+'" data-row="'+id+'"><rect class="hit" x="30" y="'+(y-h/2)+'" width="'+(W-60)+'" height="'+h+'" rx="8"/>'+(inner||'')+'</g>'}

for(const st of I.stages)for(const s of st.steps){s.ref=st.n+'.'+s.n;s.frictions=I.friction.filter(f=>f.placed&&f.placed.step===s.ref)}
for(const st of I.stages){
  let first=true;
  for(const g of groups(st.steps)){
    const stageLabel=first?'<text x="44" y="'+(first?30:0)+'" font-size="13" font-weight="700" letter-spacing="2" fill="'+C.dim+'">'+String(st.n).padStart(2,'0')+'</text><text x="74" y="30" font-size="15" font-weight="500" fill="'+C.dim+'">'+esc(st.name)+'</text>':'';
    if(Array.isArray(g)){
      const [l,r]=g,y0=first?16:4,h=y0+SPLIT*2+ROW+14,y=y0+SPLIT+ROW/2,y1=y0+SPLIT*2+ROW;
      const taken=s=>s.status!=='skipped';
      const path=(x,s)=>'<path d="'+fork(y0,y1,x)+'" fill="none" stroke="'+(s.status==='skipped'?C.ahead:lineState(s)==='ahead'?C.ahead:C.line)+'" stroke-width="3" stroke-linecap="round" opacity="'+(s.status==='skipped'?.6:1)+'"/>';
      // the taken branch is drawn last, over the other
      const order=taken(l)?[[r,AXIS+SPLIT*2-4],[l,AXIS-SPLIT*2+4]]:[[l,AXIS-SPLIT*2+4],[r,AXIS+SPLIT*2-4]];
      let html=stageLabel;
      for(const [s,x] of order)html+=path(x,s);
      for(const [s,x] of [[l,AXIS-SPLIT*2+4],[r,AXIS+SPLIT*2-4]]){const side=s===l?'l':'r';html+=hitArea(st.n+'.'+s.n,y,ROW,s,st,stop(x,y,s)+label(x,y,side,s)+marks(x,y,s,side))}
      const both=g.some(s=>lineState(s)==='ahead')?'ahead':'done';
      const el=block(html,h,lineState(l)==='ahead'&&lineState(r)==='ahead'?'ahead':'done',both,[]);
      el.querySelectorAll('.seg').forEach(seg=>{seg.style.display='none'});
      // the line only above and below the split
      el.insertAdjacentHTML('afterbegin','<i class="seg done" style="top:0;height:'+y0+'px"></i><i class="seg '+both+'" style="top:'+y1+'px;bottom:0"></i>');
      if(first)el.classList.add('stage-rule');
      for(const s of g)wireRow(el,{id:st.n+'.'+s.n,s,st});
    }else{
      const s=g,top=first?16:0,h=top+ROW+(note(s)?8:0),y=top+ROW/2;
      const html=stageLabel+hitArea(st.n+'.'+s.n,y,ROW,s,st,stop(AXIS,y,s)+label(AXIS,y,'r',s)+marks(AXIS,y,s,'r'));
      const above=s.status==='ahead'?'ahead':'done',below=s.status==='passed'||s.status==='skipped'?'done':'ahead';
      const el=block(html,h,above,below,[{id:st.n+'.'+s.n,s,st}]);
      if(first)el.classList.add('stage-rule');
    }
    first=false;
  }
}
// the end: delivered, and where Owner stepped in after it
{
  const d=I.delivered,after=I.friction.filter(f=>f.after_delivery&&!f.placed),during=I.friction.filter(f=>!f.after_delivery);
  let html='<rect x="'+(AXIS-14)+'" y="18" width="28" height="4" rx="2" fill="'+(d?C.dim:C.ahead)+'" data-tip="delivered"/>';
  if(d)html+=hitArea('delivered',20,36,{name:'delivered'},{n:''},'<text x="'+(AXIS+26)+'" y="25" font-size="15" font-weight="600" fill="'+C.dim+'">delivered</text>');
  if(d&&after.length)html+='<g data-tip="you stepped in '+after.length+' times after delivery" class="row" tabindex="0" role="button" aria-label="you stepped in after delivery" data-row="after"><circle cx="'+PROBLEM_X+'" cy="66" r="14" fill="'+C.ground+'" stroke="'+C.orange+'" stroke-width="2.5"/><text x="'+PROBLEM_X+'" y="71" text-anchor="middle" font-size="13" font-weight="700" fill="'+C.orange+'">'+after.length+'</text></g>';
  const el=block(html,d?100:40,I.status==='delivered'?'done':'ahead','after',[]);
  el.querySelector('.seg.after').style.top='22px';
  el.classList.add('stage-rule');
  if(!d)el.querySelector('.seg.after').remove();
  if(d)wireRow(el,{id:'delivered',delivered:d});
  if(after.length)wireRow(el,{id:'after',friction:after});
}

// ---- drilling in
function happenedHtml(s){
  const h=s.happened;let out='';
  for(const f of s.frictions||[])out+='<span class="label orange">you stepped in'+(f.after_delivery?' after delivery':'')+' · '+time(f.at)+'</span><p class="quote">“'+esc(f.prompt)+'”</p><span class="label">why it counts as friction</span><p>'+esc(f.why)+'</p><span class="label">why this step should have caught it</span><p>'+esc(f.placed.why)+'</p>';
  if(h.skip)out+='<span class="label">skipped</span><p>Only when '+esc(s.when)+'. '+esc(I.issue)+' is a '+esc(I.kind)+'.</p>';
  for(const v of h.verdicts){
    const who=v.by==='drillmaster'?'Drillmaster':v.by==='owner'?'You':'Agent\'s own check';
    out+='<span class="label'+(v.accepted?'':' sand')+'">'+(v.accepted?'passed':'sent back')+' · '+who+' · '+time(v.at)+'</span>';
    if(v.by!=='agent')out+='<p>'+esc(v.why)+'</p>';
  }
  if(h.waiting)out+='<span class="label sand">'+(h.waiting==='drillmaster'?'waiting for Drillmaster\'s review':'waiting for you')+'</span>';
  else if(s.status==='here')out+='<span class="label sand">Agent is working on this step</span>'+(s.calls.length?'':'<p>Nothing reported here yet.</p>');
  if(h.submitted)out+='<span class="label">Agent reported</span><p>'+esc(h.submitted)+'</p>';
  for(const r of h.reports)out+='<span class="label">'+esc(r.kind)+'</span><p>'+esc(r.text)+'</p>';
  if(!out)out='<p style="color:var(--dim)">Not reached yet.</p>';
  return out;
}
function evidenceHtml(s){
  const e=s.evidence;let out='';
  for(const c of e.self_check)out+='<span class="label">'+(c.accepted?'&#10003; ':'&#10007; ')+'Agent checked rule '+esc(c.rule)+'</span><p>'+esc(c.evidence)+'</p>';
  for(const c of e.captures)out+='<span class="label">'+esc(c.name==='tests'?'test totals':c.name==='failures'?'failing tests':c.name)+', as the tool printed them</span><div class="mono">'+[...new Set(c.lines)].map(esc).join('\n')+'</div>';
  return out||'<p style="color:var(--dim)">No evidence kept for this step.</p>';
}
function callsHtml(s){return s.calls.map(c=>'<div class="call"><span class="t">'+time(c.at)+'</span><b>'+esc(c.tool)+(c.failed?' <span style="color:var(--sand)">failed</span>':'')+'</b><span class="in">'+esc(c.did)+'</span></div>').join('')}
function frictionHtml(list){return list.map(f=>'<span class="label orange">you stepped in · '+time(f.at)+'</span><p class="quote">“'+esc(f.prompt)+'”</p>'+(f.why?'<span class="label">why it counts as friction</span><p>'+esc(f.why)+'</p>':'')).join('')}
function deliveredHtml(d){
  let out='<span class="label">delivered · '+time(d.at)+'</span><p>'+esc(d.summary)+'</p>';
  for(const p of d.post_mortems){
    out+='<span class="label">'+(p.author==='drillmaster'?'Drillmaster':'Agent')+': keep</span>'+p.keep.map(t=>'<p>'+esc(t)+'</p>').join('');
    if(p.change.length)out+='<span class="label sand">'+(p.author==='drillmaster'?'Drillmaster':'Agent')+': change</span>'+p.change.map(t=>'<p>'+esc(t)+'</p>').join('');
  }
  return out;
}
function wireRow(el,r){
  const g=el.querySelector('[data-row="'+r.id+'"]');if(!g)return;
  const panels=el.querySelector('.panels');
  const toggle=()=>{
    const open=panels.querySelector('[data-for="'+r.id+'"]');
    if(open){open.remove();return}
    const p=document.createElement('div');p.className='panel';p.dataset.for=r.id;
    if(r.friction){p.innerHTML='<div class="lvl">'+frictionHtml(r.friction)+'</div>';panels.appendChild(p);return}
    if(r.delivered){p.innerHTML='<div class="lvl">'+deliveredHtml(r.delivered)+'</div>';panels.appendChild(p);return}
    const s=r.s;
    p.innerHTML='<div class="lvl">'+happenedHtml(s)+'</div>';
    const hasEvidence=s.evidence.self_check.length||s.evidence.captures.length;
    const deeper=(level)=>{
      if(level===2&&hasEvidence){const b=button('the evidence ›',()=>{b.remove();p.insertAdjacentHTML('beforeend','<div class="lvl">'+evidenceHtml(s)+'</div>');deeper(3)});p.lastElementChild.appendChild(b)}
      else if(level<=3&&s.calls.length){const b=button('every tool call · '+s.calls.length+' ›',()=>{b.remove();p.insertAdjacentHTML('beforeend','<div class="lvl">'+callsHtml(s)+'</div>')});p.lastElementChild.appendChild(b)}
    };
    if(s.status!=='skipped'&&s.status!=='ahead')deeper(2);
    panels.appendChild(p);
  };
  g.addEventListener('click',toggle);
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
}
function button(text,onClick){const b=document.createElement('button');b.className='more';b.textContent=text;b.addEventListener('click',onClick);return b}

// ---- header: a past moment names itself; find a work item by its number
const aside=document.getElementById('aside');
const moment=I.status==='delivered'?'':new Date(I.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'UTC'})+' UTC · workflow '+I.workflow_version+' <a href="#">now</a>';
aside.innerHTML=(moment?'<span>'+moment+'</span>':'')+'<a href="#">work items</a><input class="find" id="find" placeholder="# find" aria-label="find a work item by its number">';
document.getElementById('find').addEventListener('keydown',e=>{if(e.key==='Enter'){const n=e.target.value.replace(/\D/g,'');if(window.ITEMS[n])location.search='?item='+n}});

// ---- key and tips, as on the Workflow page
const sw=(inner,word,color)=>'<span style="color:'+(color||C.dim)+'"><svg width="18" height="18" viewBox="0 0 18 18">'+inner+'</svg>'+word+'</span>';
const all=I.stages.flatMap(st=>st.steps),has={
  always:all.some(s=>kindOf(s)==='always'),if:all.some(s=>kindOf(s)==='if'),approve:all.some(s=>kindOf(s)==='approve'),review:all.some(s=>kindOf(s)==='review'),
  passed:all.some(s=>s.happened.verdicts.some(v=>v.by==='drillmaster'&&v.accepted)),back:all.some(s=>s.happened.verdicts.some(v=>!v.accepted&&v.by!=='agent')),
  skipped:all.some(s=>s.status==='skipped'),ahead:all.some(s=>s.status==='ahead'||s.status==='here'),here:all.some(s=>s.status==='here'),friction:I.friction.length>0};
const only=(on,html)=>on?html:'';
document.getElementById('key').innerHTML=
  only(has.always,sw('<rect x="3" y="3" width="12" height="12" rx="3" fill="'+C.line+'"/>','always'))
 +only(has.if,sw('<rect x="3.5" y="3.5" width="11" height="11" rx="3" fill="none" stroke="'+C.line+'" stroke-width="1.8"/>','if'))
 +only(has.approve,sw('<path d="M9 2 L16 9 L9 16 L2 9 Z" fill="none" stroke="'+C.sand+'" stroke-width="1.8"/>','you approve',C.sand))
 +only(has.review,sw('<circle cx="9" cy="9" r="7" fill="none" stroke="'+C.line+'" stroke-width="1.6"/><rect x="6" y="6" width="6" height="6" rx="1" fill="'+C.line+'"/>','Drillmaster reviews'))
 +only(has.passed,sw('<text x="9" y="14" text-anchor="middle" font-size="13" font-weight="700" fill="'+C.line+'">&#10003;</text>','Drillmaster passed'))
 +only(has.back,sw('<text x="9" y="14" text-anchor="middle" font-size="13" font-weight="700" fill="'+C.sand+'">&#8617;</text>','sent back',C.sand))
 +only(has.skipped,sw('<rect x="3" y="3" width="12" height="12" rx="3" fill="'+C.line+'" opacity=".28"/>','skipped'))
 +only(has.ahead,sw('<path d="M9 1 V17" stroke="'+C.ahead+'" stroke-width="3"/>','not reached yet'))
 +only(has.here,sw('<circle cx="9" cy="9" r="4.5" fill="'+C.line+'"/>','where it is now'))
 +only(has.friction,sw('<circle cx="9" cy="9" r="6.5" fill="none" stroke="'+C.orange+'" stroke-width="2"/>','you stepped in',C.orange));
const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{const m=e.target.closest&&e.target.closest('[data-tip]');if(!m){tip.style.display='none';return}tip.textContent=m.getAttribute('data-tip');tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-340)+'px';tip.style.top=Math.min(e.clientY+14,innerHeight-40)+'px'});
addEventListener('scroll',()=>{tip.style.display='none'},{passive:true});
history.scrollRestoration='manual';
</script>
</body></html>
